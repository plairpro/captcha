<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captcha</title>
<meta name="description" content="Prove you're human. The captcha lies.">
<meta property="og:title" content="Captcha">
<meta property="og:description" content="Prove you're human. The captcha lies.">
<meta property="og:image" content="https://plairpro.github.io/captcha/cover.jpg">
<meta property="og:image:width" content="720">
<meta property="og:image:height" content="1280">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plairpro.github.io/captcha/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://plairpro.github.io/captcha/cover.jpg">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="plair-verify" content="plair-f5c067704585">
<script src="https://plair.pro/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Roboto:wght@400;500;700&display=swap">
<style>
/* layout: one captcha widget on a dark "desk", game title and progress strip above it */
:root{
  --desk:#191d28; --desk-dot:#ffffff12; --desk-ink:#e7e9f1; --desk-muted:#9aa1b5;
  --card:#ffffff; --ink:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f4f5f7;
  --blue:#3b72d9; --blue-d:#2c5cb9; --ok:#1e8e3e; --bad:#d93025; --warn:#ffd25e;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{
  margin:0;background:var(--desk);color:var(--desk-ink);font-family:var(--body);
  background-image:radial-gradient(var(--desk-dot) 1px,transparent 1.5px);background-size:18px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:56px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:100%;
}
.top{width:min(400px,100%);display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.tag{margin:0;color:var(--desk-muted);font-size:15px;line-height:1.4}
.prog{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--desk-muted);font-variant-numeric:tabular-nums}
.prog .seg{display:flex;gap:4px;flex:1}
.prog i{flex:1;height:4px;border-radius:2px;background:#ffffff1f}
.prog i.done{background:var(--ok)}
.prog i.now{background:var(--desk-ink)}

/* start card */
.start{width:min(400px,100%);background:var(--soft);border:1px solid #d3d3d3;border-radius:3px;box-shadow:0 2px 8px #0000004d;display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 14px;color:var(--ink)}
.sbox,.rbox{display:flex;align-items:center;gap:12px;border:0;background:none;font:400 15px var(--body);color:var(--ink);cursor:pointer;padding:6px}
.cb{width:28px;height:28px;border:2px solid #c1c1c1;border-radius:2px;background:#fff;flex:none;display:grid;place-items:center;transition:border-radius .2s}
.spin .cb{border:4px solid #4a90e2;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;background:transparent}
.done .cb{border-color:transparent;background:none}
.done .cb::after{content:"";width:9px;height:18px;border:solid var(--ok);border-width:0 4px 4px 0;transform:rotate(45deg) translate(-2px,-2px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;color:#555;font-size:10px}
.brand b{font-size:10px;font-weight:500;letter-spacing:.02em}
.brand small{font-size:8px;color:#888}
@keyframes spin{to{transform:rotate(360deg)}}

/* widget */
.w{width:min(400px,100%);background:var(--card);color:var(--ink);border:1px solid #cfd2d6;box-shadow:0 10px 30px #00000066;padding:8px;display:flex;flex-direction:column}
.w.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.head{background:var(--blue);color:#fff;padding:20px 20px 0;position:relative;transition:background .3s}
.w.good .head{background:var(--ok)}
.pre,.sub{font-size:14px;line-height:1.35}
.word{font-size:28px;font-weight:700;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.word.flip{animation:flip .35s}
@keyframes flip{0%{opacity:0;transform:translateY(-6px) skewX(-12deg)}100%{opacity:1;transform:none}}
.sub{opacity:.95;min-height:19px}
.tbar{height:4px;background:#ffffff38;margin:16px -20px 0}
.tbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transition:background .3s}
.tbar i.low{background:var(--warn)}
.tbar i.crit{background:#ff8a80}

.body{margin-top:8px;position:relative}
.board{position:relative;width:100%;aspect-ratio:1;background:#fff;overflow:hidden;--ts:90px}
.board[hidden],.run[hidden],.end[hidden]{display:none!important}
.scene{position:absolute;inset:0}
.scene{background-size:cover;background-position:center}
.spr{position:absolute;transform:translate(-50%,-50%);pointer-events:none;user-select:none;filter:drop-shadow(0 2px 2px #0006)}
.tile{position:absolute;border:0;padding:0;margin:0;cursor:pointer;background:transparent;overflow:hidden;-webkit-tap-highlight-color:transparent}
.board.anim .tile{transition:left .42s ease-in-out,top .42s ease-in-out}
.tile .in{position:absolute;inset:0;transition:transform .14s ease,opacity .35s ease}
.tile .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#9aa0a6}
.tile .ph.pop{animation:pop .4s}
@keyframes pop{0%{opacity:0;scale:1.25}100%{opacity:1;scale:1}}
.tile.sel .in,.tile.sel .back{transform:scale(.8)}
.tile.sel::after{content:"✓";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font:700 13px/22px var(--body);text-align:center;box-shadow:0 0 0 2px #fff}
.tile.fade .in{opacity:0}
.tile.win{box-shadow:0 0 0 2px #fff}
.tile.win.sel{box-shadow:0 0 0 2px #fff,inset 0 0 0 7px #fff}
.tile .ph.spinme{animation:spinme var(--sd,6s) linear infinite}
@keyframes spinme{from{transform:rotate(var(--r0,0deg))}to{transform:rotate(calc(var(--r0,0deg) + 360deg))}}
.board.blurry .tile .ph{filter:blur(var(--bl,0px)) saturate(.8);scale:1.12}
.dark{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at var(--lx,50%) var(--ly,50%),transparent 0,transparent var(--lr,60px),rgba(4,6,12,.96) calc(var(--lr,60px) + 34px))}
.tile.fall{transition:transform .9s cubic-bezier(.5,0,.9,.6),opacity .9s;transform:translateY(160%) rotate(var(--fr,25deg));opacity:0;pointer-events:none}
.board.spinning{transition:none}
.board .tile.sel{z-index:4}
.tile.hit{animation:hit .5s}
.tile.win.reveal{box-shadow:0 0 0 2px #fff,inset 0 0 0 5px #34c759;animation:reveal .6s 3}
@keyframes reveal{50%{box-shadow:0 0 0 2px #fff,inset 0 0 0 9px #34c759}}
@keyframes hit{0%,60%{box-shadow:0 0 0 2px #fff,inset 0 0 0 9999px #1e8e3e66}100%{box-shadow:0 0 0 2px #fff}}
.tile.miss{animation:miss .4s}
@keyframes miss{0%,60%{box-shadow:0 0 0 2px #fff,inset 0 0 0 9999px #d9302555}}
.tile .back{z-index:1;position:absolute;inset:0;display:none;place-items:center;color:#ffffff73;font:800 calc(var(--ts)*.36) var(--display);background:repeating-linear-gradient(45deg,#3b72d9 0 9px,#3467c6 9px 18px);transition:transform .14s}
.tile.cover .back{display:grid}
.tile:focus-visible{outline:3px solid #fbbc04;outline-offset:-3px;z-index:2}
.mover{position:absolute;width:calc(var(--ts)*.62);pointer-events:none;will-change:left,top,transform;filter:drop-shadow(2px 4px 3px #0007)}

.run{position:relative;width:100%;aspect-ratio:1;background:var(--soft);border:1px dashed #cfd2d6;overflow:hidden;touch-action:none}
.rbox{position:absolute;background:#fff;border:1px solid #d3d3d3;border-radius:3px;box-shadow:0 1px 4px #0002;padding:12px 16px 12px 12px;transition:left .16s ease-out,top .16s ease-out;white-space:nowrap}
.rbox:focus-visible{outline:3px solid #fbbc04}

.end{width:100%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:var(--soft)}
.end .seal{width:84px;height:84px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.end .seal::after{content:"";width:22px;height:42px;border:solid #fff;border-width:0 8px 8px 0;transform:rotate(45deg) translate(-4px,-4px)}
.end h2{margin:6px 0 0;font:800 24px var(--display)}
.end .pct{font:800 54px/1 var(--display);color:var(--blue);font-variant-numeric:tabular-nums}
.end dl{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin:6px 0 0;font-size:14px;text-align:left;font-variant-numeric:tabular-nums}
.end dt{color:var(--muted)}
.end dd{margin:0;font-weight:500}
.end p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:30ch;line-height:1.4}

.end{gap:8px}
.end .seal{width:52px;height:52px}
.end .seal::after{width:14px;height:26px;border-width:0 5px 5px 0}
.end h2{font-size:18px}
.end .unit{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-4px}
.end .unit.rec{color:var(--ok);font-weight:700}
.end dd.neg{color:var(--bad)}
.psc{font:800 14px var(--display);color:var(--desk-ink);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:0}
.psc.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35);color:#7be495}}
.trow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));display:flex;border:1px solid #ffffff33;border-radius:999px;padding:2px;background:var(--desk);z-index:5}
.top:has(.hide + .hide){display:none}
.chal{margin:0;align-self:center;background:#f6c34422;color:var(--warn);border:1px solid #f6c34466;border-radius:999px;padding:6px 14px;font:700 13px var(--body);letter-spacing:.02em}
.lang button{border:0;background:none;color:var(--desk-muted);font:700 12px var(--body);letter-spacing:.06em;padding:6px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--desk-ink);color:var(--desk)}
.lang button:focus-visible{outline:3px solid #fbbc04;outline-offset:1px}
.msg{min-height:44px;padding:10px 6px 8px;font-size:14px;line-height:1.35;color:var(--muted)}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--ok);font-weight:500}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 2px 2px;gap:8px}
.icons{display:flex;gap:4px}
.ic{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#6b6f75}
.ic:hover{background:#f1f3f4}
.ic svg{width:24px;height:24px}
.go{background:var(--blue);color:#fff;border:0;border-radius:2px;font:500 14px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:13px 22px;cursor:pointer;min-width:132px}
.go:hover{background:var(--blue-d)}
.go:disabled{background:#9db6e6;cursor:default}
.go:focus-visible,.ic:focus-visible,.sbox:focus-visible{outline:3px solid #fbbc04;outline-offset:2px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>


<div class="top">
  <p class="chal hide" id="chal"></p>
  <div class="prog hide" id="prog"><span id="plabel">1 / 10</span><span class="seg" id="pseg"></span><span class="psc" id="pscore">0</span></div>
</div>

<div class="start" id="start">
  <button class="sbox" id="sbox"><span class="cb"></span><span id="sLbl">Я не робот</span></button>
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4a12 12 0 0 1 11.3 8" fill="none" stroke="#1c3aa9" stroke-width="4"/><path d="M28 16a12 12 0 0 1-8 11.3" fill="none" stroke="#4285f4" stroke-width="4"/><path d="M16 28A12 12 0 0 1 4 16" fill="none" stroke="#ababab" stroke-width="4"/><path d="M4.7 12A12 12 0 0 1 12 4.7" fill="none" stroke="#4285f4" stroke-width="4"/></svg>
    <b id="brand">капча-ли</b><small id="legal">Конфиденциальность · Условия</small>
  </div>
</div>

<div class="w hide" id="widget">
  <div class="head">
    <div class="pre" id="pre"></div>
    <div class="word" id="word"></div>
    <div class="sub" id="sub"></div>
    <div class="tbar"><i id="tfill"></i></div>
  </div>
  <div class="body">
    <div class="board" id="board"></div>
    <div class="run" id="run" hidden><button class="rbox" id="rbox"><span class="cb"></span><span id="rLbl">Я не робот</span></button></div>
    <div class="end" id="end" hidden></div>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="foot">
    <div class="icons">
      <button class="ic" id="icReload" aria-label="Новые картинки"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
      <button class="ic" id="icAudio" aria-label="Аудиопроверка"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg></button>
      <button class="ic" id="icInfo" aria-label="Подсказка"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg></button>
    </div>
    <button class="go" id="go">Пропустить</button>
  </div>
</div>

<script>const $=s=>document.querySelector(s);
const W=$('#widget'),board=$('#board'),msgEl=$('#msg'),goBtn=$('#go'),run=$('#run'),rbox=$('#rbox'),endEl=$('#end');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const div=c=>{const d=document.createElement('div');d.className=c;return d};
const range=(k,ids)=>ids.map(i=>`img/${k}${i}.jpg`);

/* ---------- язык ---------- */
let lang='ru';
lang=(navigator.languages&&navigator.languages[0]||navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en';
const t=(ru,en)=>lang==='en'?en:ru;
function applyStatic(){
  document.documentElement.lang=lang;
  document.title="Captcha";
  $('#sLbl').textContent=$('#rLbl').textContent=t('Я не робот',"I'm not a robot");
  $('#brand').textContent=t('капча-ли','captcha-ish');
  $('#legal').textContent=t('Конфиденциальность · Условия','Privacy · Terms');
  $('#icReload').setAttribute('aria-label',t('Новые картинки','New images'));
  $('#icAudio').setAttribute('aria-label',t('Аудиопроверка','Audio challenge'));
  $('#icInfo').setAttribute('aria-label',t('Подсказка','Hint'));
  showChallenge();
}
function setLang(l){if(l===lang)return;lang=l;applyStatic();
  if(ended)finish(true);else if(L&&!$('#widget').classList.contains('hide'))startLevel(level);else updateGo()}

/* ---------- PLAIR: вызов «побей мой рекорд» ---------- */
let challenge=null;
function showChallenge(){if(!challenge)return;const tag=$('#chal');tag.classList.remove('hide');
  tag.textContent=(challenge.name?challenge.name+': ':'')+t(`побей ${challenge.score} очков`,`beat ${challenge.score} points`)}
try{if(window.PLAIR&&PLAIR.onChallenge)PLAIR.onChallenge(function(c){if(c&&c.score!=null){challenge=c;showChallenge()}})}catch(e){}

/* фото-пулы */
const P={
  light:range('light',[0,1,2,3,5,6,7,8]), road:['img/light4.jpg'],
  moto:range('moto',[0,1,2,3,4,5,6,7,8]), bike:range('bike',[0,1,2,3,4,5,6,7,8]),
  hyd:range('hyd',[0,1,2,3,4,5,6,7,8]), misc:range('misc',[0,1,2,3,4,5,6,7,8]),
  cat:range('ani',[0,1,2]), dog:range('ani',[3,4,5]), duck:range('ani',[6,7,8]),
  robot:range('robot',[1,2,3,4,5,6,7]), ppl:range('ppl',[0,1,2,3,4,5,6,7,8])
};
[...Object.values(P).flat(),'img/bus.jpg','img/road.jpg','img/grass.jpg','img/market.jpg','img/scooter.png','img/ant.png','img/bug.png'].forEach(s=>{const i=new Image();i.src=s});

let tiles=[],n=3,level=0,L=null,S={timers:[]},timeLeft=1,timeMax=1,running=false,locked=false,ended=false;
let mistakes=0,sus=0,tStart=0,score=0,levelFails=0,stat={base:0,speed:0,clean:0},secs=0,reported=false;
function bump(){const e=$('#pscore');e.textContent=score;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}

const ph=(src,target=false,extra={})=>({src,target,flip:!src.includes('misc')&&Math.random()<.35,...extra});
function pick(pool,k,used){const a=shuffle(pool.filter(s=>!used.has(s))).slice(0,k);a.forEach(s=>used.add(s));return a}
function deal(N,pool,k,decoys){const used=new Set();const out=pick(pool,k,used).map(s=>ph(s,true));
  const d=pick(decoys.flat(),N-k,used);d.forEach(s=>out.push(ph(s,false)));while(out.length<N)out.push(ph(rnd(decoys.flat())));return shuffle(out)}

/* ---------- board ---------- */
function build(nn,contents,opts={}){
  n=nn;board.innerHTML='';tiles=[];board.classList.remove('anim');S.scene=null;
  if(opts.scene){const sc=div('scene');sc.style.backgroundImage=`url(${opts.scene})`;board.append(sc);S.scene=sc}
  for(let i=0;i<n*n;i++){
    const el=document.createElement('button');el.className='tile'+(opts.scene?' win':'');el.setAttribute('aria-label',t('Квадрат ','Square ')+(i+1));
    const inn=div('in'),p=div('ph');if(!opts.scene)inn.append(p);
    const back=div('back');back.textContent='?';el.append(inn,back);
    const tl={el,inn,p,cell:i,c:null,sel:false};if(contents)setContent(tl,contents[i]);
    el.addEventListener('click',()=>onTile(tl));place(tl);board.append(el);tiles.push(tl);
  }
  resize();
}
function place(x){const r=Math.floor(x.cell/n),c=x.cell%n,p=100/n;Object.assign(x.el.style,{left:`calc(${c*p}% + 2px)`,top:`calc(${r*p}% + 2px)`,width:`calc(${p}% - 4px)`,height:`calc(${p}% - 4px)`})}
function setContent(x,c,pop){x.c=c;if(!c)return;x.p.style.backgroundImage=`url(${c.src})`;x.p.style.transform=(c.flip?'scaleX(-1) ':'')+(c.rot?`rotate(${c.rot}deg)`:'');x.p.classList.toggle('spinme',!!c.spin);if(c.spin)x.p.style.setProperty('--r0',(c.rot||0)+'deg'),x.p.style.setProperty('--sd',c.spin+'s');
  x.p.classList.remove('pop');if(pop){void x.p.offsetWidth;x.p.classList.add('pop')}}
function setSel(x,v){x.sel=v;x.el.classList.toggle('sel',v);updateGo()}
function resize(){const w=board.clientWidth||run.clientWidth||360;board.style.setProperty('--ts',(w/n)+'px')}
new ResizeObserver(resize).observe(board);
function sprite(src,x,y,size,rot=0){const im=document.createElement('img');im.src=src;im.alt='';im.className='spr';
  Object.assign(im.style,{left:x/n*100+'%',top:y/n*100+'%',width:`calc(var(--ts)*${size})`,transform:`translate(-50%,-50%) rotate(${rot}deg)`});S.scene.append(im);return im}

/* ---------- ui helpers ---------- */
function setHead(pre,word,sub){$('#pre').textContent=pre;const w=$('#word');w.textContent=word;w.classList.remove('flip');void w.offsetWidth;w.classList.add('flip');$('#sub').textContent=sub||''}
function say(s,k=''){msgEl.textContent=s;msgEl.className='msg '+k}
function later(f,ms){const id=setTimeout(f,ms);S.timers.push(id);return id}
function shake(){W.classList.remove('shake');void W.offsetWidth;W.classList.add('shake')}
function updateGo(){if(ended){goBtn.textContent=t('Ещё раз','Play again');return}
  if(L&&L.goLabel){goBtn.textContent=L.goLabel();return}goBtn.textContent=tiles.some(x=>x.sel)?t('Подтвердить','Verify'):t('Пропустить','Skip')}
function wrongTiles(isT){return tiles.filter(x=>x.sel!==!!(x.c&&(isT?isT(x):x.c.target)))}

  failMsg:()=>t('Спасли что-то не то.','You saved the wrong thing.'),
  winMsg:()=>t('Утки спасены. Остальное не жалко.','Ducks saved. Nobody will miss the rest.')
},
{ // 16. муравьи: ползают по траве
  time:30,hint:()=>t('Ищите то, что шевелится. Муравьёв двое, божьи коровки не в счёт.','Look for what moves. There are two ants; ladybugs do not count.'),
  setup(){setHead(PICKSQ(),t('муравьи','ants'),t('Их двое, и они ползают. Божьи коровки не считаются.','There are two, and they crawl. Ladybugs do not count.'));
    build(5,null,{scene:'img/grass.jpg'});
    const cells=shuffle([...Array(25).keys()]);S.ants=new Set(cells.slice(0,2));S.crawl=[];
    const put=(cell,src,size,mv)=>{const r=Math.floor(cell/5),c=cell%5,b={x0:c+.28,x1:c+.72,y0:r+.28,y1:r+.72};
      const o={x:c+.3+Math.random()*.4,y:r+.3+Math.random()*.4,a:Math.random()*Math.PI*2,sp:mv,b,size};
      o.el=sprite(src,o.x,o.y,size,o.a*180/Math.PI+90);S.crawl.push(o)};
    cells.slice(0,2).forEach(c=>put(c,'img/ant.png',.46,.22));cells.slice(2,5).forEach(c=>put(c,'img/bug.png',.38,.05));
    tiles.forEach(x=>x.c={target:S.ants.has(x.cell)})},
  tick(dt){for(const o of S.crawl){if(!o.sp)continue;o.a+=(Math.random()-.5)*4*dt;
    let nx=o.x+Math.cos(o.a)*o.sp*dt,ny=o.y+Math.sin(o.a)*o.sp*dt;
    if(nx<o.b.x0||nx>o.b.x1){o.a=Math.PI-o.a;nx=Math.max(o.b.x0,Math.min(o.b.x1,nx))}
    if(ny<o.b.y0||ny>o.b.y1){o.a=-o.a;ny=Math.max(o.b.y0,Math.min(o.b.y1,ny))}
    o.x=nx;o.y=ny;Object.assign(o.el.style,{left:o.x/n*100+'%',top:o.y/n*100+'%',transform:`translate(-50%,-50%) rotate(${o.a*180/Math.PI+90}deg)`})}},
  verify(){const w=wrongTiles();if(!w.length)return win(t('Оба муравья найдены. Зрение как у муравьеда.','Both ants found. Eyes like an anteater.'));
    const found=tiles.filter(x=>x.sel&&x.c.target).length,extra=tiles.filter(x=>x.sel&&!x.c.target).length;
    tiles.forEach(x=>{if(x.c.target)x.el.classList.add('reveal')});
    fail(extra?t(`Лишний квадрат. Муравьи были там, где подсвечено.`,`Extra square selected. The ants were in the highlighted squares.`)
      :t(`Найдено ${found} из 2. Остальные подсвечены.`,`Found ${found} of 2. The rest are highlighted.`))}
},
{ // 17. финал
  time:40,hint:()=>t('Галочка убегает не вечно. А потом — люди иногда ошибаются.','The checkbox cannot run forever. And then: humans make mistakes.'),
  setup(){S.phaseA=1;S.esc=6;S.lastJ=0;board.hidden=true;run.hidden=false;rbox.classList.remove('spin','done');
    setHead(t('Последний шаг. Отметьте','Last step. Check'),t('«Я не робот»','"I\'m not a robot"'),t('Просто нажмите на галочку.','Just click the checkbox.'));goBtn.disabled=true;
    requestAnimationFrame(()=>{rbox.style.left=(run.clientWidth-rbox.offsetWidth)/2+'px';rbox.style.top=(run.clientHeight-rbox.offsetHeight)/2+'px'})},
  verify(){
    if(S.phaseA)return say(t('Сначала галочка.','Checkbox first.'));
    const w=wrongTiles();
    if(!tiles.some(x=>x.sel))return fail(t('«Пропустить» — любимая кнопка роботов.','"Skip" is a robot\'s favorite button.'),true);
    if(!w.length){sus++;score=Math.max(0,score-10);bump();tiles.forEach(x=>setSel(x,false));return fail(t('Идеально. Слишком идеально. Так отвечают только роботы.','Perfect. Too perfect. Only robots answer like that.'),true)}
    win(t('Вот теперь верим. Добро пожаловать, человек.','Now we believe you. Welcome, human.'))}
}
];

/* финальная галочка */
function jump(){const now=performance.now();if(now-S.lastJ<220)return;S.lastJ=now;
  const W2=run.clientWidth-rbox.offsetWidth-8,H2=run.clientHeight-rbox.offsetHeight-8;
  const cx=parseFloat(rbox.style.left)||0,cy=parseFloat(rbox.style.top)||0;let x,y,g=0;
  do{x=4+Math.random()*W2;y=4+Math.random()*H2}while(Math.hypot(x-cx,y-cy)<W2*.45&&++g<30);
  rbox.style.left=x+'px';rbox.style.top=y+'px';S.esc--;
  say(t(['Галочка устала. Жмите.','Ладно, ладно.','Почти.','Галочка стесняется.','Не так быстро.','Ой.'],['The checkbox is tired. Click it.','Fine, fine.','Almost.','The checkbox is shy.','Not so fast.','Oops.'])[S.esc])}
function checkBox(){S.phaseA=0;rbox.classList.add('spin');say(t('Проверяем…','Verifying…'));
  later(()=>{rbox.classList.remove('spin');rbox.classList.add('done');
    later(()=>{run.hidden=true;board.hidden=false;goBtn.disabled=false;timeLeft=Math.max(timeLeft,22);
      setHead(t('Подозрительно быстро. Выберите все','Suspiciously fast. Select all images with'),t('светофоры','traffic lights'),t('Подсказка: люди иногда ошибаются.','Hint: humans sometimes make mistakes.'));
      build(3,deal(9,P.light,4,[P.road,P.misc]));updateGo();say(t('Ещё одна проверка. Последняя. Наверное.','One more check. The last one. Probably.'))},700)},1000)}
run.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!S.phaseA||S.esc<=0||locked)return;
  const r=rbox.getBoundingClientRect();const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);
  if(Math.hypot(dx,dy)<34)jump()});
rbox.addEventListener('pointerdown',e=>{if(!S.phaseA||locked||!running)return;e.preventDefault();S.esc>0?jump():checkBox()});
rbox.addEventListener('click',e=>{if(e.detail!==0||!S.phaseA||!running)return;S.esc>0?jump():checkBox()});

/* ---------- loop ---------- */
let last=performance.now();const tfill=$('#tfill');
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running&&!locked&&!S.pause&&L){timeLeft-=dt;if(L.tick)L.tick(dt);
    if(timeLeft<=0){timeLeft=0;fail(rnd(t(['Время вышло. Люди думают долго, но не настолько.','Время вышло. Вы точно не уснули?'],['Time is up. Humans are slow, but not that slow.','Time is up. Did you fall asleep?'])))}}
  const f=Math.max(0,Math.min(1,timeLeft/timeMax));tfill.style.transform=`scaleX(${f})`;
  tfill.className=f<.15?'crit':f<.35?'low':'';requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- start / end ---------- */
function begin(){ended=false;reported=false;mistakes=0;sus=0;score=0;levelFails=0;stat={base:0,speed:0,clean:0};$('#pscore').textContent='0';
  tStart=performance.now();$('#start').classList.add('hide');W.classList.remove('hide');$('#prog').classList.remove('hide');startLevel(0)}
$('#pseg').innerHTML='<i></i>'.repeat(LEVELS.length);
$('#sbox').addEventListener('click',function(){if(this.classList.contains('spin'))return;this.classList.add('spin');
  setTimeout(()=>{this.classList.remove('spin');this.classList.add('done');setTimeout(begin,500)},900)});
function finish(rerender){ended=true;running=false;board.hidden=true;run.hidden=true;endEl.hidden=false;
  if(!rerender)secs=Math.round((performance.now()-tStart)/1000);
  const p=Math.max(51,Math.min(99,99-mistakes*5-sus*2));
  const line=p>92?t('Подозрительно хорошо. Мы будем за вами наблюдать.','Suspiciously good. We will be watching you.'):p>75?t('Сойдёт. Роботы так не нервничают.','Good enough. Robots do not get this nervous.'):t('Много ошибок. Очень по-человечески.','Lots of mistakes. Very human.');
  let best=0,rec=false;
  try{best=+localStorage.getItem('nr-best')||0;if(!rerender){rec=score>best;if(rec)localStorage.setItem('nr-best',String(score));finish.rec=rec;finish.prev=best}else{rec=finish.rec;best=finish.prev}}catch(e){}
  const unit=rec?(best?t('новый рекорд','new record'):t('очков','points')):t('очков · рекорд ','points · best ')+best;
  endEl.innerHTML=`<div class="seal"></div><h2>${t('Вы человек на','You are')} ${p}%${t('',' human')}</h2><div class="pct">${score}</div>
    <div class="unit${rec?' rec':''}">${unit}</div>
    <dl><dt>${t('Проверки','Checks')}</dt><dd>+${stat.base}</dd><dt>${t('Бонус за скорость','Speed bonus')}</dt><dd>+${stat.speed}</dd>
    <dt>${t('С первой попытки','First try')}</dt><dd>${stat.clean} × 50</dd><dt>${t('Подозрительные действия','Suspicious actions')}</dt><dd class="neg">−${sus*10}</dd>
    <dt>${t('Ошибки · время','Mistakes · time')}</dt><dd>${mistakes} · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</dd></dl><p>${line}</p>`;
  setHead(t('Проверка пройдена','Verification complete'),t('спасибо, человек','thank you, human'),t('Можно идти. Капча вас запомнила.','You may go. The captcha will remember you.'));timeLeft=timeMax;
  say('');goBtn.disabled=false;updateGo();
  [...$('#pseg').children].forEach(i=>i.className='done');$('#plabel').textContent=`${LEVELS.length} / ${LEVELS.length}`;
  /* PLAIR: итоговый счёт — ровно один раз за партию */
  if(!reported){reported=true;try{if(window.PLAIR)PLAIR.score(score)}catch(e){}}
}
goBtn.addEventListener('click',()=>{if(ended){begin();return}if(!running||locked||S.pause||!L)return;L.verify?L.verify():stdVerify()});
$('#icReload').addEventListener('click',()=>say(rnd(t(['Новые картинки загружены. Они такие же.','Обновили. Ничего не изменилось.','Перезагрузка не спасёт.'],['New images loaded. They look the same.','Refreshed. Nothing changed.','Reloading will not save you.']))));
$('#icAudio').addEventListener('click',()=>say(t('Аудиопроверка: «бип-буп-бип». Если вы это поняли, у нас вопросы.','Audio challenge: "beep-boop-beep". If you understood that, we have questions.')));
$('#icInfo').addEventListener('click',()=>say(L&&!ended?L.hint():t('Нажмите на галочку, чтобы начать.','Click the checkbox to start.')));
applyStatic();updateGo();
</script>
